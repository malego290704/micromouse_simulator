<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a new save</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/common/theme.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.2/dist/pocketbase.umd.js"></script>
    <script src="script.js" defer></script>
</head>
<body class="centerchild">
    <div class="gradient-bg outer">
        <div class="gradient-bg inner"></div>
    </div>
    <main class="w3-card w3-round-xxlarge w3-white">
        <section>
            <h1>Create a new save</h1>
        </section>
        <form id="form">
            <label for="maze">Maze</label>
            <select name="maze" id="maze" class="w3-select w3-border w3-round-large w3-hover-light-gray maze-selector">
                <option value="0" disabled selected>Choose a maze</option>
            </select>
            <template id="maze-select-template">
                <option value="" class="maze-select"></option>
            </template>
            <label for="savename">Name</label>
            <input required type="text" class="w3-input w3-border w3-round-large w3-hover-light-gray" id="savename">
            <div></div>
            <input type="submit" class="w3-button w3-ripple w3-block w3-round-large w3-black w3-hover-light-gray" value="Create" style="transition: 200ms;">
        </form>
        <!-- <a href="/home/register" class="w3-button w3-ripple w3-block w3-round-large w3-hover-light-gray w3-hover-border-white" style="transition: 200ms; border: 2px black solid;">Register</a> -->
    </main>
</body>
</html>
